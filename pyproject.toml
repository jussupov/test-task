[tool.poetry]
name = "test-task"
version = "0.1.0"
description = ""
authors = ["jussupov <jus.kz09@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
django = "^5.1.12"
django-rest-framework = "^0.1.0"
django-filter = "^25.1"
djangorestframework-jsonapi = {extras = ["django-filter"], version = "^7.1.0"}
gunicorn = "^23.0.0"
psycopg2 = "^2.9.10"
django-environ = "^0.12.0"
django-extensions = "^3.2.3"
django-crispy-forms = "^2.3"
crispy-bootstrap5 = "^2024.10"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-django = "^4.10.0"
pytest-cov = "^6.0.0"
black = "^25.1.0"
isort = "^6.0.1"
flake8 = "^7.1.2"
pre-commit = "^4.1.0"


[tool.flake8]
ignore = ["E501"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
